<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة الهندسة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f4f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid #1e3a8a;
        }
    </style>
</head>
<body>

    <div class="login-card shadow">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">تسجيل الدخول</h2>
            <p class="text-muted small">أهلاً بك في منصة الهندسة الذكية</p>
        </div>

        <form action="dashboard.html">
            <div class="mb-3">
                <label class="form-label">كود الطالب</label>
                <input type="text" class="form-control" placeholder="أدخل الكود الخاص بك" required>
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background-color: #1e3a8a;">
                دخول للمنصة
            </button>
        </form>
    </div>

</body>
</html>
